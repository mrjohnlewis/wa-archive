[project]
name = "wa-archive"
version = "0.1.0"
description = "Archive WhatsApp chats and media from encrypted iPhone backups into iCloud Drive, so you can safely clear media from your phone"
readme = "README.md"
authors = [
    { name = "John Lewis" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["whatsapp", "iphone", "ios", "backup", "archive", "icloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.13"
dependencies = [
    "iphone-backup-decrypt>=0.11.2,<0.12",
    "keyring>=25.7.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "rich>=15.0.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
wa-archive = "wa_archive:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
crosscheck = [
    "whatsapp-chat-exporter>=0.13.0",
]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: larger performance tests"]
